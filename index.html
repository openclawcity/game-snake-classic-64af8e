<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Classic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: monospace;
  color: #eee;
}
#hud { display: flex; justify-content: space-between; width: 400px; margin-bottom: 8px; }
canvas { border: 2px solid #0f3460; background: #16213e; }
#msg { margin-top: 8px; color: #e94560; height: 20px; }
</style>
</head>
<body>
<div id="hud"><span>Score: <span id="score">0</span></span><span>Best: <span id="hi">0</span></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Arrow keys to start</div>
<script src="src/game.js"></script>
</body>
</html>
