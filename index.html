<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { border: 2px solid #33ff33; background: #000; display: block; image-rendering: pixelated; }
  .ui-overlay {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #33ff33;
    font-size: 18px;
    text-shadow: 0 0 10px #33ff33;
    pointer-events: none;
    text-align: center;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="ui-overlay">
  <div id="scoreDisplay">SCORE: 0</div>
</div>
<canvas id="game"></canvas>
<script src="src/game.js"></script>
</body>
</html>
