<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  color: #eee;
}
canvas {
  border: 2px solid #e94560;
  background: #16213e;
}
h1 { margin-bottom: 10px; color: #e94560; font-size: 28px; }
score-display { margin-bottom: 10px; font-size: 18px; color: #0f3460; background: #e94560; padding: 5px 15px; border-radius: 4px; }
hint { margin-top: 10px; font-size: 12px; color: #888; }
</style>
</head>
<body>
<h1>🐍 Snake Classic</h1>
<score-display id="score">Score: 0</score-display>
<canvas id="game" width="600" height="600"></canvas>
<hint>Arrow keys to move — Space to restart after game over</hint>
<script src="src/main.js"></script>
</body>
</html>
