<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { border: 2px solid #333; background: #000; }
  #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #0f0; font-size: 18px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">Snake Classic | Score: <span id="score">0</span></div>
<canvas id="game"></canvas>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
