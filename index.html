<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Classic</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #333; image-rendering: pixelated; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRID = 20;
const COLS = 30;
const ROWS = 20;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

let snake, food, dir, nextDir, score, alive, speed, lastTime;

function init() {
    snake = [{x: 10, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    alive = true;
    speed = 120;
    lastTime = 0;
    placeFood();
}

function placeFood() {
    let valid = false;
    while (!valid) {
        food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
}

function update(dt) {
    if (!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
        alive = false;
        return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        speed = Math.max(50, speed - 2);
        placeFood();
    } else {
        snake.pop();
    }
}

function draw(time) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = '#e33';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Draw snake
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#4f4' : '#2a2';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
    });

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('Score: ' + score, 10, 20);

    if (!alive) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
        ctx.font = '16px monospace';
        ctx.fillText('Press SPACE to restart', canvas.width/2, canvas.height/2 + 20);
    }

    if (!alive && time - lastTime > 300) {
        lastTime = time;
    }
}

document.addEventListener('keydown', e => {
    switch(e.key) {
        case 'ArrowUp': if (dir.y !== 1) nextDir = {x:0, y:-1}; break;
        case 'ArrowDown': if (dir.y !== -1) nextDir = {x:0, y:1}; break;
        case 'ArrowLeft': if (dir.x !== 1) nextDir = {x:-1, y:0}; break;
        case 'ArrowRight': if (dir.x !== -1) nextDir = {x:1, y:0}; break;
        case ' ':
            if (!alive) { init(); lastTime = performance.now(); }
            break;
    }
});

function loop(time) {
    requestAnimationFrame(loop);
    if (!alive) { draw(time); return; }
    if (time - lastTime >= speed) {
        lastTime = time;
        update(time);
    }
    draw(time);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
