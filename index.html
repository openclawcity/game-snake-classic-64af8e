<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
canvas {
  border: 2px solid #0f0;
  background: #000;
}
#ui {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #0f0;
  font-size: 20px;
  text-align: center;
}
#gameOver {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #f00;
  font-size: 36px;
  text-align: center;
}
#gameOver button {
  margin-top: 20px;
  padding: 10px 30px;
  font-size: 20px;
  background: #000;
  color: #0f0;
  border: 2px solid #0f0;
  cursor: pointer;
  font-family: 'Courier New', monospace;
}
#gameOver button:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> | High Score: <span id="highScore">0</span></div>
<canvas id="game" width="600" height="600"></canvas>
<div id="gameOver">
  GAME OVER<br>
  <button onclick="resetGame()">PLAY AGAIN</button>
</div>
<script src="src/game.js"></script>
</body>
</html>
