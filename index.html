<!DOCTYPE html>
<html>
<head>
    <title>Snake Classic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        canvas { border: 2px solid #0f0; }
        #info { position: absolute; top: 10px; color: #0f0; font-size: 18px; text-align: center; width: 100%; }
    </style>
</head>
<body>
    <div id="info">Score: <span id="score">0</span> | High Score: <span id="highscore">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>
    <script src="src/game.js"></script>
</body>
</html>
