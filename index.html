<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #0f0;
    overflow: hidden;
  }
  canvas {
    border: 2px solid #0f0;
    background: #000;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }
  #score {
    font-size: 24px;
    margin-bottom: 5px;
  }
  #highScore {
    font-size: 16px;
    color: #0a0;
  }
  #gameOver {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 2px solid #0f0;
    padding: 30px 40px;
    text-align: center;
    z-index: 20;
  }
  #gameOver h2 {
    font-size: 36px;
    margin-bottom: 15px;
    color: #f00;
  }
  #gameOver p {
    font-size: 18px;
    margin-bottom: 15px;
  }
  #gameOver button {
    background: #0f0;
    color: #000;
    border: none;
    padding: 10px 25px;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
  }
  #gameOver button:hover {
    background: #0a0;
  }
  #instructions {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #0a0;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="highScore">High Score: 0</div>
</div>
<canvas id="game"></canvas>
<div id="gameOver">
  <h2>GAME OVER</h2>
  <p id="finalScore">Score: 0</p>
  <button id="restartBtn">PLAY AGAIN</button>
</div>
<div id="instructions">Arrow keys / WASD to move</div>
<script src="src/game.js"></script>
</body>
</html>
