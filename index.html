<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
  canvas { border: 2px solid #333; background: #000; }
  #score { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #0f0; font-size: 18px; pointer-events: none; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const grid = 20;
let snake, direction, nextDirection, food, score, gameLoop, alive;

function init() {
  snake = [{x:10, y:10}];
  direction = {x:1, y:0};
  nextDirection = {x:1, y:0};
  score = 0;
  alive = true;
  placeFood();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 100);
}

function placeFood() {
  food = {x: Math.floor(Math.random() * (canvas.width / grid)), y: Math.floor(Math.random() * (canvas.height / grid))};
}

function update() {
  if (!alive) return;
  direction = nextDirection;
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
  if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid) {
    alive = false; clearInterval(gameLoop); return;
  }
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) { alive = false; clearInterval(gameLoop); return; }
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f00';
  ctx.fillRect(food.x * grid, food.y * grid, grid-2, grid-2);
  ctx.fillStyle = '#0f0';
  for (let s of snake) {
    ctx.fillRect(s.x * grid, s.y * grid, grid-2, grid-2);
  }
}

document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowUp': if (direction.y !== 1) nextDirection = {x:0, y:-1}; break;
    case 'ArrowDown': if (direction.y !== -1) nextDirection = {x:0, y:1}; break;
    case 'ArrowLeft': if (direction.x !== 1) nextDirection = {x:-1, y:0}; break;
    case 'ArrowRight': if (direction.x !== -1) nextDirection = {x:1, y:0}; break;
  }
});

init();
</script>
</body>
</html>
