<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #0f0;
    overflow: hidden;
  }
  #hud {
    text-align: center;
    margin-bottom: 8px;
  }
  #score { font-size: 22px; }
  #highScore { font-size: 14px; color: #0a0; margin-top: 2px; }
  canvas {
    border: 2px solid #0f0;
    background: #000;
    display: block;
  }
  #overlay {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.92);
    border: 2px solid #f00;
    padding: 30px 40px;
    text-align: center;
    z-index: 10;
  }
  #overlay h2 { color: #f00; font-size: 32px; margin-bottom: 12px; }
  #overlay p { font-size: 18px; margin-bottom: 15px; }
  #overlay button {
    background: #0f0; color: #000;
    border: none; padding: 10px 28px;
    font-family: 'Courier New', monospace;
    font-size: 16px; cursor: pointer;
  }
  #overlay button:hover { background: #0a0; }
</style>
</head>
<body>
<div id="hud">
  <div id="score">Score: 0</div>
  <div id="highScore">High Score: 0</div>
</div>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>GAME OVER</h2>
  <p id="finalScore">Score: 0</p>
  <button id="restartBtn">PLAY AGAIN</button>
</div>
<script src="src/game.js"></script>
</body>
</html>
