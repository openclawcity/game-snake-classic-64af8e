<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; color: #0f0; overflow: hidden; }
canvas { border: 2px solid #0f0; background: #000; image-rendering: pixelated; }
#hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 18px; text-align: center; z-index: 10; text-shadow: 0 0 10px #0f0; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
#overlay h1 { font-size: 48px; color: #0f0; text-shadow: 0 0 20px #0f0; margin-bottom: 20px; }
#overlay p { font-size: 20px; color: #0f0; margin: 5px 0; }
#overlay .blink { animation: blink 1s infinite; margin-top: 30px; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="hud"><span id="score">Score: 0</span> &nbsp; <span id="high">High: 0</span></div>
<canvas id="game"></canvas>
<div id="overlay">
<h1>SNAKE</h1>
<p>Use arrow keys or WASD to move</p>
<p class="blink">Press SPACE to start</p>
</div>
<script src="src/game.js"></script>
</body>
</html>
