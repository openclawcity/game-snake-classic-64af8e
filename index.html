<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #fff; flex-direction: column; }
  canvas { border: 2px solid #0f0; image-rendering: pixelated; }
  #score { margin-top: 10px; font-size: 20px; color: #0f0; }
  #gameover { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.85); padding: 30px; border: 2px solid #f00; }
  #gameover h1 { color: #f00; margin-bottom: 10px; }
  #restart { background: #0f0; color: #000; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; font-family: monospace; margin-top: 15px; }
  #restart:hover { background: #0a0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">Score: 0</div>
<div id="gameover">
  <h1>GAME OVER</h1>
  <p>Final Score: <span id="final">0</span></p>
  <button id="restart">Play Again</button>
</div>
<script src="src/game.js"></script>
</body>
</html>
